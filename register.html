<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="register.css">

<body>
    <div class="container">
        <h1>student registeraton form</h1>
        <p class="subtitle">Fill your details below</p>
        <form action="" method="get">

             post->send the data to server -->

        <div class="form-group">
            <label for="Name">Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>
        <div>
            <label for="Email">Email: </label> 
            <input type="email" name="" id="" placeholder="Enter your eamil id" required>
        </div>
            
                
        <div>
            <label for="password">password: </label> 
            <input type="password" name="" id="" placeholder="Enter your password" required>
            
        </div>
        <div class="form-group">
            <label for="">Gender</label>
            <select name="" id="">
                <option value="">select</option>
                <option value="">Male</option>
                <option value="">Female</option>
            </select>
        </div>
        <div class="form-group">
            <label for="">courses</label>
            <select name="" id="">
                <option value="">Btech</option>
                <option value="">BCA</option>
                <option value="">MCA</option>
                <option value="">MTECH</option>
            </select>
        </div>
        <div>
                    <label for="">About</label>
                    <textarea name="" id="" placeholder="write something here"></textarea>
        </div>
        <div class="check">
                    <input type="checkbox" name="" id="">
                    <label for="">I agree to the terms and conditions</label>
        </div>
     <button type="submit">Register now</button>

      
                
            
    </div>
    
    
</body>
